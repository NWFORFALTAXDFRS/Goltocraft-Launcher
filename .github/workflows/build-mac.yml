name: Build Goltocraft Launcher Mac

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Compiler Goltocraft Launcher Mac
        run: npx electron-builder --mac dmg --universal --publish never

      - name: Sauvegarder le DMG
        uses: actions/upload-artifact@v4
        with:
          name: Goltocraft-Launcher-Mac
          path: dist/*.dmg
          if-no-files-found: error